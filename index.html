<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', system-ui, -apple-system, sans-serif; }
    body { background: #f4f5f7; color: #333; padding: 40px 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-family: 'Yatra One', cursive; font-size: 1.8rem; text-align: center; }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; font-weight: 600; color: #555; }
    input[type="file"], input[type="text"], textarea, button {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; background: #fff;
    }
    .color-picker-row { display: flex; gap: 10px; align-items: center; }
    input[type="color"] {
      width: 60px; height: 44px; padding: 2px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; background: #fff;
    }
    textarea { resize: vertical; min-height: 130px; font-family: 'Mukta', sans-serif; }
    button { background: #111; color: #fff; border: none; cursor: pointer; font-weight: 600; padding: 12px; }
    button:hover { background: #333; }
    
    #output { display: flex; flex-direction: column; gap: 28px; margin-top: 20px; }
    .slide-card {
      background: #fff; padding: 18px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; gap: 14px;
    }
    .slide-canvas {
      width: 100%; height: auto; border-radius: 8px; display: block; background: #1e293b;
    }
    .slide-controls {
      display: flex; flex-direction: column; gap: 12px; background: #f9fafb; padding: 14px; border-radius: 8px; border: 1px solid #eee;
    }
    .slider-row { display: flex; flex-direction: column; gap: 4px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; color: #555; }
    .slider-header span { color: #2563eb; }
    input[type="range"] { width: 100%; padding: 0; height: 6px; cursor: pointer; }
    .download-btn {
      display: block; text-align: center; padding: 10px; background: #2563eb; color: #fff; text-decoration: none;
      border-radius: 6px; font-size: 0.95rem; font-weight: 600;
    }
    .download-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

<div class="container">
  <h1>Slide Generator</h1>

  <div class="control-group">
    <label for="bgImage">Background Image</label>
    <input type="file" id="bgImage" accept="image/*">
  </div>

  <div class="control-group">
    <label>Text Color</label>
    <div class="color-picker-row">
      <input type="color" id="colorPicker" value="#ffffff">
      <input type="text" id="hexInput" placeholder="#FFFFFF" value="#ffffff">
    </div>
  </div>

  <div class="control-group">
    <label for="slideText">Slide Content (separate slides with double newlines)</label>
    <textarea id="slideText" placeholder="मुख्य शीर्षक यहाँ लिखें&#10;यहाँ आपका विवरण और मुख्य संदेश आएगा।&#10;&#10;दूसरा शीर्षक&#10;अगली स्लाइड की जानकारी यहाँ पेस्ट करें।"></textarea>
  </div>

  <button id="generateBtn">Generate Slides</button>

  <div id="output"></div>
</div>

<script>
  const bgInput = document.getElementById('bgImage');
  const colorPicker = document.getElementById('colorPicker');
  const hexInput = document.getElementById('hexInput');
  const textInput = document.getElementById('slideText');
  const generateBtn = document.getElementById('generateBtn');
  const output = document.getElementById('output');

  let bgImg = null;

  // 1. Sync Color Picker and Hex Input (Universal for iOS/Android)
  colorPicker.addEventListener('input', (e) => {
    hexInput.value = e.target.value.toUpperCase();
  });

  hexInput.addEventListener('input', (e) => {
    let val = e.target.value.trim();
    if (!val.startsWith('#') && (val.length === 3 || val.length === 6)) {
      val = '#' + val;
    }
    if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
      colorPicker.value = val;
    }
  });

  // Background Image Upload
  bgInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        bgImg = new Image();
        bgImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  // Dynamic Word Wrap
  function wrapText(ctx, text, maxWidth) {
    const words = text.split(/\s+/);
    const lines = [];
    let currentLine = '';

    for (let word of words) {
      const testLine = currentLine ? `${currentLine} ${word}` : word;
      if (ctx.measureText(testLine).width > maxWidth && currentLine) {
        lines.push(currentLine);
        currentLine = word;
      } else {
        currentLine = testLine;
      }
    }
    if (currentLine) lines.push(currentLine);
    return lines;
  }

  // Draw a specific slide canvas given its individual parameters
  function drawSingleSlide(canvas, headline, bodyLinesRaw, localHeadSize, localTextSize, localGapSize, activeColor, currentBgImg) {
    const ctx = canvas.getContext('2d');

    // 1. Explicit Natural Dimensions
    if (currentBgImg && currentBgImg.naturalWidth && currentBgImg.naturalHeight) {
      canvas.width = currentBgImg.naturalWidth;
      canvas.height = currentBgImg.naturalHeight;
    } else {
      canvas.width = 1080;
      canvas.height = 1350;
    }

    const width = canvas.width;
    const height = canvas.height;
    const maxWidth = width * 0.82;

    // Independent line heights and dynamic gap based on individual sizes
    const headlineLineHeight = localHeadSize * 1.35;
    const bodyLineHeight = localTextSize * 1.45;
    const effectiveGap = (headline && bodyLinesRaw.length > 0) ? localGapSize : 0;

    // Draw background
    if (currentBgImg && currentBgImg.naturalWidth) {
      ctx.drawImage(currentBgImg, 0, 0, width, height);
    } else {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, width, height);
    }

    // Strict Canvas alignment properties
    ctx.direction = 'ltr';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 2. Measure & Wrap Headline with individual localHeadSize
    ctx.font = `${localHeadSize}px "Yatra One", cursive`;
    const wrappedHeadline = headline ? wrapText(ctx, headline, maxWidth) : [];

    // 3. Measure & Wrap Normal Text with individual localTextSize
    ctx.font = `500 ${localTextSize}px "Mukta", sans-serif`;
    const wrappedBody = [];
    bodyLinesRaw.forEach(line => {
      wrappedBody.push(...wrapText(ctx, line, maxWidth));
    });

    // 4. Calculate vertical centering using overall height
    const totalHeight = (wrappedHeadline.length * headlineLineHeight) + effectiveGap + (wrappedBody.length * bodyLineHeight);
    let yPosition = (height / 2) - (totalHeight / 2) + (headlineLineHeight / 2);

    // Shared shadow and color
    ctx.fillStyle = activeColor;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
    ctx.shadowBlur = Math.round(width * 0.015);
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;

    // 5. Draw Headline
    if (wrappedHeadline.length > 0) {
      ctx.direction = 'ltr';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${localHeadSize}px "Yatra One", cursive`;

      wrappedHeadline.forEach(line => {
        ctx.fillText(line, canvas.width / 2, yPosition);
        yPosition += headlineLineHeight;
      });
    }

    // Dynamic Spacing Gap between Headline & Normal Text
    if (wrappedHeadline.length > 0 && wrappedBody.length > 0) {
      yPosition += effectiveGap - (headlineLineHeight / 2) + (bodyLineHeight / 2);
    }

    // 6. Draw Normal Text
    if (wrappedBody.length > 0) {
      ctx.direction = 'ltr';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `500 ${localTextSize}px "Mukta", sans-serif`;

      wrappedBody.forEach(line => {
        ctx.fillText(line, canvas.width / 2, yPosition);
        yPosition += bodyLineHeight;
      });
    }
  }

  // Generate All Slides with Individual Controls
  function renderAllSlides() {
    const rawText = textInput.value.trim();
    if (!rawText) return alert('Please enter some text.');

    output.innerHTML = '';
    const paragraphs = rawText.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
    const activeColor = colorPicker.value;
    const capturedBgImg = bgImg;

    paragraphs.forEach((para, index) => {
      const lines = para.split('\n').map(l => l.trim()).filter(Boolean);
      const headline = lines[0] || '';
      const bodyLinesRaw = lines.slice(1);

      // Slide card DOM container
      const card = document.createElement('div');
      card.className = 'slide-card';

      // Canvas element
      const canvas = document.createElement('canvas');
      canvas.className = 'slide-canvas';

      // Controls container
      const controlsDiv = document.createElement('div');
      controlsDiv.className = 'slide-controls';

      // 1. Headline Size Slider
      const headRow = document.createElement('div');
      headRow.className = 'slider-row';
      headRow.innerHTML = `
        <div class="slider-header">
          <span>Headline Size</span>
          <span class="val-display">80px</span>
        </div>
        <input type="range" class="headSize" min="30" max="150" value="80">
      `;
      const headSlider = headRow.querySelector('input');
      const headValDisplay = headRow.querySelector('.val-display');

      // 2. Normal Text Size Slider
      const textRow = document.createElement('div');
      textRow.className = 'slider-row';
      textRow.innerHTML = `
        <div class="slider-header">
          <span>Normal Text Size</span>
          <span class="val-display">50px</span>
        </div>
        <input type="range" class="textSize" min="20" max="100" value="50">
      `;
      const textSlider = textRow.querySelector('input');
      const textValDisplay = textRow.querySelector('.val-display');

      // 3. Spacing / Gap Size Slider
      const gapRow = document.createElement('div');
      gapRow.className = 'slider-row';
      gapRow.innerHTML = `
        <div class="slider-header">
          <span>Spacing between Headline & Text</span>
          <span class="val-display">50px</span>
        </div>
        <input type="range" class="gapSize" min="0" max="300" value="50">
      `;
      const gapSlider = gapRow.querySelector('input');
      const gapValDisplay = gapRow.querySelector('.val-display');

      // 4. Download Button
      const downloadBtn = document.createElement('a');
      downloadBtn.className = 'download-btn';
      downloadBtn.textContent = `Download Slide ${index + 1}`;
      downloadBtn.download = `slide-${index + 1}.png`;

      // Helper to redraw only this slide using current slider values
      function updateThisSlide() {
        const localHeadSize = parseInt(headSlider.value, 10);
        const localTextSize = parseInt(textSlider.value, 10);
        const localGapSize = parseInt(gapSlider.value, 10);

        headValDisplay.textContent = `${localHeadSize}px`;
        textValDisplay.textContent = `${localTextSize}px`;
        gapValDisplay.textContent = `${localGapSize}px`;

        drawSingleSlide(canvas, headline, bodyLinesRaw, localHeadSize, localTextSize, localGapSize, activeColor, capturedBgImg);
        downloadBtn.href = canvas.toDataURL('image/png');
      }

      // Live Slider Events (Re-renders ONLY this specific slide)
      headSlider.addEventListener('input', () => {
        updateThisSlide();
      });

      textSlider.addEventListener('input', () => {
        updateThisSlide();
      });

      gapSlider.addEventListener('input', () => {
        updateThisSlide();
      });

      // Initial draw for this slide
      updateThisSlide();

      // Assemble card
      controlsDiv.appendChild(headRow);
      controlsDiv.appendChild(textRow);
      controlsDiv.appendChild(gapRow);
      card.appendChild(canvas);
      card.appendChild(controlsDiv);
      card.appendChild(downloadBtn);
      output.appendChild(card);
    });
  }

  // Generate Button Click with Font Ready Promise for iOS Safari
  generateBtn.addEventListener('click', () => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        renderAllSlides();
      });
    } else {
      renderAllSlides();
    }
  });
</script>

</body>
</html>
